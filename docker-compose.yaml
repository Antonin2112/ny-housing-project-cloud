#version: '3.8'

services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mdpdev
      POSTGRES_DB: ny_housing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./housing.csv:/housing.csv
  web:
    build: ./app
    ports:
      - "5000:5000"
    depends_on:
      - db
volumes:
  postgres_data: